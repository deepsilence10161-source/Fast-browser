<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Bookmarks - FastBrowser</title>
  <style>
    :root {
      --bg: #202124;
      --card: #292a2d;
      --border: rgba(255, 255, 255, 0.1);
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #8ab4f8;
      --hover: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .list { padding: 24px; max-width: 800px; display: flex; flex-direction: column; gap: 10px; }
    .bm-row { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .bm-row:hover { background: var(--hover); }
    .bm-favicon { width: 18px; height: 18px; object-fit: contain; }
    .bm-title { font-weight: 500; font-size: 14px; color: var(--accent); flex: 1; }
    .bm-url { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⭐ Bookmarks</div>
  </div>
  <div class="list" id="bm-list">
    <div class="bm-row" onclick="nav('https://lmarena.ai')">
      <img class="bm-favicon" src="https://lmarena.ai/favicon.ico">
      <span class="bm-title">LMArena.ai</span>
      <span class="bm-url">https://lmarena.ai</span>
    </div>
    <div class="bm-row" onclick="nav('https://github.com/deepsilence10161-source/Fast-browser')">
      <img class="bm-favicon" src="https://github.githubassets.com/favicons/favicon.svg">
      <span class="bm-title">Fast-browser GitHub Repository</span>
      <span class="bm-url">https://github.com/deepsilence10161-source/Fast-browser</span>
    </div>
    <div class="bm-row" onclick="nav('https://en.wikipedia.org')">
      <img class="bm-favicon" src="https://en.wikipedia.org/favicon.ico">
      <span class="bm-title">Wikipedia</span>
      <span class="bm-url">https://en.wikipedia.org</span>
    </div>
    <div class="bm-row" onclick="nav('https://news.ycombinator.com')">
      <img class="bm-favicon" src="https://news.ycombinator.com/favicon.ico">
      <span class="bm-title">Hacker News</span>
      <span class="bm-url">https://news.ycombinator.com</span>
    </div>
  </div>
  <script>
    function nav(url) {
      window.parent.postMessage({ type: 'NAVIGATE', url }, '*');
    }
  </script>
</body>
</html>
